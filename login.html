<script>

/* =====================================================
   CITY CHOICE BAKERY
   CUSTOMER AUTH SYSTEM

   IMPORTANT:

   Customer profile is now created by
   Supabase database trigger.

   This JavaScript DOES NOT insert into:
   public.users

   This JavaScript DOES NOT use:
   delivery_boys

   This JavaScript DOES NOT use:
   user_id
===================================================== */


/* =====================================================
   REDIRECT
===================================================== */

function getRedirectPage(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const redirect =
    params.get("redirect");

  if(
    redirect &&
    !/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(redirect) &&
    !redirect.startsWith("//") &&
    !redirect.includes("\\")
  ){

    return redirect;

  }

  return "account.html";

}



/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin(){

  const overlay =
    document.getElementById("modalOverlay");

  const signupBox =
    document.getElementById("signupBox");

  const loginBox =
    document.getElementById("loginBox");


  overlay.classList.remove("hidden");

  signupBox.classList.remove("active");
  signupBox.classList.add("hidden");

  loginBox.classList.remove("hidden");

  setTimeout(()=>{

    loginBox.classList.add("active");

  },10);

}



/* =====================================================
   SHOW SIGNUP
===================================================== */

function showSignup(){

  const overlay =
    document.getElementById("modalOverlay");

  const loginBox =
    document.getElementById("loginBox");

  const signupBox =
    document.getElementById("signupBox");


  overlay.classList.remove("hidden");

  loginBox.classList.remove("active");
  loginBox.classList.add("hidden");

  signupBox.classList.remove("hidden");

  setTimeout(()=>{

    signupBox.classList.add("active");

  },10);

}



/* =====================================================
   CLOSE FORMS
===================================================== */

function closeForms(){

  const loginBox =
    document.getElementById("loginBox");

  const signupBox =
    document.getElementById("signupBox");

  loginBox.classList.remove("active");
  signupBox.classList.remove("active");


  setTimeout(()=>{

    loginBox.classList.add("hidden");
    signupBox.classList.add("hidden");

    document
      .getElementById("modalOverlay")
      .classList
      .add("hidden");

  },300);

}



/* =====================================================
   LOCATION
===================================================== */

function getLocation(){

  if(!navigator.geolocation){

    showTopAlert(
      "error",
      "Unsupported Device",
      "Location is not supported on this device."
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    async(position)=>{

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      try{

        const response =
          await fetch(
            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`,
            {
              headers:{
                "Accept":"application/json"
              }
            }
          );


        if(!response.ok){

          throw new Error(
            "Location service unavailable."
          );

        }


        const data =
          await response.json();


        const address =
          data.address || {};


        const area =
          address.city ||
          address.town ||
          address.village ||
          address.suburb ||
          address.county ||
          data.display_name ||
          "";


        document
          .getElementById("location")
          .value =
            area;


        showTopAlert(
          "success",
          "Location Found",
          area || "Location detected successfully."
        );

      }
      catch(error){

        console.error(
          "Location Error:",
          error
        );


        showTopAlert(
          "error",
          "Location Error",
          error.message ||
          "Unable to fetch your location."
        );

      }

    },


    (error)=>{

      console.error(
        "GPS Error:",
        error
      );


      showTopAlert(
        "error",
        "Location Error",
        "Permission denied or GPS is OFF."
      );

    },


    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:300000
    }

  );

}



/* =====================================================
   CUSTOMER SIGNUP
===================================================== */

async function signupUser(){

  const signupButton =
    document.getElementById(
      "signupButton"
    );


  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  const email =
    document
      .getElementById("email")
      .value
      .trim()
      .toLowerCase();


  const password =
    document
      .getElementById("password")
      .value;


  const pincode =
    document
      .getElementById("pincodeSelect")
      .value;


  const location =
    document
      .getElementById("location")
      .value
      .trim();



  /* ===================================================
     REQUIRED
  =================================================== */

  if(
    !name ||
    !phone ||
    !email ||
    !password
  ){

    showTopAlert(
      "error",
      "Missing Fields",
      "Please fill all required fields."
    );

    return;

  }



  /* ===================================================
     PASSWORD
  =================================================== */

  if(password.length < 6){

    showTopAlert(
      "error",
      "Weak Password",
      "Password must be at least 6 characters."
    );

    return;

  }



  /* ===================================================
     PINCODE
  =================================================== */

  if(!pincode){

    showTopAlert(
      "error",
      "Pincode Required",
      "Please select your pincode."
    );

    return;

  }



  /* ===================================================
     DISABLE BUTTON
  =================================================== */

  signupButton.disabled = true;

  signupButton.innerText =
    "Creating Account...";



  try{


    /* =================================================
       CHECK PINCODE
    ================================================= */

    const {
      data: pinData,
      error: pinError
    } =
      await supabaseClient
        .from("pincodes")
        .select("code");


    if(pinError){

      console.error(
        "Pincode Error:",
        pinError
      );

      throw new Error(
        "Unable to check delivery area: " +
        pinError.message
      );

    }


    const allowed =
      (pinData || []).map(
        pin => String(pin.code)
      );


    if(
      !allowed.includes(
        String(pincode)
      )
    ){

      throw new Error(
        "Sorry! Is area me delivery available nahi hai."
      );

    }



    /* =================================================
       AUTH SIGNUP

       DATABASE TRIGGER WILL CREATE:

       public.users

       DO NOT INSERT PROFILE HERE.
    ================================================= */

    const {
      data,
      error
    } =
      await supabaseClient.auth.signUp({

        email:
          email,

        password:
          password,

        options:{

          data:{

            role:
              "customer",

            name:
              name,

            phone:
              phone,

            pincode:
              pincode,

            location:
              location

          }

        }

      });



    /* =================================================
       AUTH ERROR
    ================================================= */

    if(error){

      console.error(
        "Supabase Signup Error:",
        error
      );

      throw new Error(
        error.message
      );

    }



    /* =================================================
       AUTH USER CHECK
    ================================================= */

    if(!data?.user){

      throw new Error(
        "Customer account could not be created."
      );

    }



    /* =================================================
       PROFILE TRIGGER CHECK
    ================================================= */

    /*
      The trigger runs immediately after auth user
      creation.

      Give database a short moment before checking.
    */

    await new Promise(
      resolve =>
        setTimeout(resolve,500)
    );


    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient
        .from("users")
        .select(
          "id,name,phone,email,pincode,location,user_type"
        )
        .eq(
          "id",
          data.user.id
        )
        .maybeSingle();


    if(profileError){

      console.error(
        "Profile Check Error:",
        profileError
      );

      throw new Error(
        "Account created but customer profile could not be checked: " +
        profileError.message
      );

    }


    if(!profile){

      throw new Error(
        "Account created but customer profile was not created. Please check the Supabase customer trigger."
      );

    }



    /* =================================================
       SUCCESS
    ================================================= */

    console.log(
      "Customer account:",
      data.user
    );

    console.log(
      "Customer profile:",
      profile
    );


    showTopAlert(
      "success",
      "Signup Successful",
      "Customer account and profile created successfully."
    );


    const redirectPage =
      getRedirectPage();


    setTimeout(()=>{

      window.location.replace(
        redirectPage
      );

    },1200);

  }


  catch(error){

    console.error(
      "CUSTOMER SIGNUP ERROR:",
      error
    );


    showTopAlert(
      "error",
      "Signup Failed",
      error?.message ||
      "Unable to create customer account."
    );

  }


  finally{

    signupButton.disabled = false;

    signupButton.innerText =
      "Create Account";

  }

}



/* =====================================================
   CUSTOMER PROFILE
===================================================== */

async function getCustomerProfile(userId){

  if(!userId){

    throw new Error(
      "Customer user ID is missing."
    );

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("users")
      .select(
        "id,created_at,name,phone,email,pincode,location,user_type"
      )
      .eq(
        "id",
        userId
      )
      .maybeSingle();


  if(error){

    console.error(
      "Customer Profile Error:",
      error
    );

    throw new Error(
      "Customer profile check failed: " +
      error.message
    );

  }


  return data;

}



/* =====================================================

===================================================== */

  const email =

      .toLowerCase();


  const password =
    document
      .getElementById("loginPassword")
      .value;


  if(!email || !password){

    showTopAlert(
      "error",
      "Missing Fields",
      "Please enter email and password."
    );

    return;

  }


  const button =
    document.getElementById(
      "loginButton"
    );


  button.disabled = true;

  button.innerText =
    "Logging in...";


  try{


    /* =================================================
       LOGIN
    ================================================= */

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .signInWithPassword({

          email:
            email,

          password:
            password

        });


    if(error){

      console.error(
        "Auth Login Error:",
        error
      );

      throw new Error(
        error.message
      );

    }


    const authUser =
      data?.user;


    if(!authUser){

      throw new Error(
        "Login failed. Account not found."
      );

    }



    /* =================================================
       CUSTOMER PROFILE
    ================================================= */

    const customer =
      await getCustomerProfile(
        authUser.id
      );


    if(!customer){

      await supabaseClient.auth.signOut();

      throw new Error(
        "This account is not registered as a customer."
      );

    }



    /* =================================================
       USER TYPE
    ================================================= */

    if(
      customer.user_type &&
      customer.user_type !== "customer"
    ){

      await supabaseClient.auth.signOut();

      throw new Error(
        "This account is not registered as a customer."
      );

    }



    /* =================================================
       SUCCESS
    ================================================= */

    showTopAlert(
      "success",
      "Login Successful",
      "Welcome back, " +
      (customer.name || "Customer") +
      "!"
    );


    const redirectPage =
      getRedirectPage();


    setTimeout(()=>{

      window.location.replace(
        redirectPage
      );

    },800);

  }


  catch(error){

    console.error(
      "CUSTOMER LOGIN ERROR:",
      error
    );


    showTopAlert(
      "error",
      "Login Failed",
      error?.message ||
      "Customer login failed."
    );

  }


  finally{

    button.disabled = false;

    button.innerText =
      "Continue";

  }

}



/* =====================================================
   PINCODES
===================================================== */

let allPincodes = [];



async function loadPincodes(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("pincodes")
        .select("*")
        .order(
          "code",
          {
            ascending:true
          }
        );


    if(error){

      console.error(
        "Pincode Loading Error:",
        error
      );

      showTopAlert(
        "error",
        "Pincode Error",
        "Unable to load delivery areas."
      );

      return;

    }


    allPincodes =
      data || [];


    renderPincodes(
      allPincodes
    );

  }
  catch(error){

    console.error(
      "Pincode Exception:",
      error
    );

  }

}



/* =====================================================
   RENDER PINCODES
===================================================== */

function renderPincodes(pincodes){

  const select =
    document.getElementById(
      "pincodeSelect"
    );


  if(!select){

    return;

  }


  select.innerHTML =
    `<option value="">
      Select Pincode
    </option>`;


  pincodes.forEach(pin=>{

    const option =
      document.createElement(
        "option"
      );


    option.value =
      pin.code;


    option.textContent =
      `${pin.code} - ${pin.area}`;


    select.appendChild(
      option
    );

  });

}



/* =====================================================
   FILTER PINCODES
===================================================== */

function filterPincodes(){

  const input =
    document.getElementById(
      "pinSearch"
    );


  const value =
    input
      .value
      .toLowerCase()
      .trim();


  const filtered =
    allPincodes.filter(
      pin => {

        return (

          String(pin.code)
            .toLowerCase()
            .includes(value)

        ) ||

        (

          String(pin.area || "")
            .toLowerCase()
            .includes(value)

        );

      }
    );


  renderPincodes(
    filtered
  );

}



/* =====================================================
   ALERT
===================================================== */

let alertTimer = null;


function showTopAlert(
  type,
  title,
  message
){

  const alertBox =
    document.getElementById(
      "topAlert"
    );


  const alertIcon =
    document.getElementById(
      "alertIcon"
    );


  document
    .getElementById("alertTitle")
    .innerText =
      title;


  document
    .getElementById("alertText")
    .innerText =
      message;


  alertBox.classList.remove(
    "success",
    "error"
  );


  if(type === "success"){

    alertBox.classList.add(
      "success"
    );


    alertIcon.innerHTML =
      `<i class="fa-solid fa-check"></i>`;

  }
  else{

    alertBox.classList.add(
      "error"
    );


    alertIcon.innerHTML =
      `<i class="fa-solid fa-xmark"></i>`;

  }


  alertBox.classList.add(
    "show"
  );


  if(alertTimer){

    clearTimeout(
      alertTimer
    );

  }


  alertTimer =
    setTimeout(()=>{

      closeTopAlert();

    },5000);

}



/* =====================================================
   CLOSE ALERT
===================================================== */

function closeTopAlert(){

  const alertBox =
    document.getElementById(
      "topAlert"
    );


  alertBox.classList.remove(
    "show"
  );

}



/* =====================================================
   START
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  async()=>{

    await loadPincodes();

  }
);

</script>
