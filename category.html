<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Page</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="category1.css">
    <link rel="stylesheet" href="back.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>

<body>

  <!-- TOP APP BAR -->
  <header class="top-app-bar">
    <h3 class="header-category-title" id="topHeaderTitle">Category</h3>
    <div class="header-cart-icon" onclick="toggleCart()">
      <i class="fa-solid fa-bag-shopping"></i>
      <span class="cart-badge-count" id="headerCartBadge">0</span>
    </div>
  </header>

  <!-- CATEGORY HERO BANNER -->
  <section class="category-hero-card" id="heroCard">
    <div class="hero-content">
      <div class="hero-text-side">
        <span class="hero-chip"><i class="fa-solid fa-sparkles"></i> Special Category</span>
        <h2 id="catName">Category</h2>
        <p id="count">0 Items Available</p>
      </div>
      <div class="hero-image-side">
        <img id="categoryHeroImg" src="https://via.placeholder.com/150" alt="Category Preview">
      </div>
    </div>
  </section>

  <!-- MAIN PRODUCTS CONTAINER -->
  <main class="main-container">
    <div class="products" id="productList"></div>
  </main>

  <!-- FLOATING BOTTOM CART BAR -->
  <div class="cart-bar" onclick="toggleCart()">
    <div class="cart-left">
      <div class="cart-badge-icon">
        <i class="fa-solid fa-basket-shopping"></i>
      </div>
      <div class="cart-text-info">
        <span class="cart-title">Your Cart</span>
        <span id="cartInfo" class="cart-sub">0 Items | ₹0</span>
      </div>
    </div>
    <button class="cart-btn">
      View Cart <i class="fa-solid fa-arrow-right"></i>
    </button>
  </div>

  <!-- CART DRAWER -->
  <div class="cart-drawer-overlay" id="cartOverlay" onclick="toggleCart()"></div>
  <div class="cart-drawer" id="cartDrawer">
    <div class="drawer-handle"></div>
    <div class="cart-header">
      <h3><i class="fa-solid fa-bag-shopping" style="color: #ff3b30;"></i> Your Cart</h3>
      <i class="fa-solid fa-xmark close-btn" onclick="toggleCart()"></i>
    </div>

    <div id="cartItems" class="cart-items-container"></div>

    <div class="cart-footer">
      <div class="total-row">
        <span>Total Amount</span>
        <strong id="cartDrawerTotal">₹0</strong>
      </div>
      <button onclick="goToCart()" class="checkout-btn">Proceed to Checkout</button>
    </div>
  </div>

  <script>
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    let params = new URLSearchParams(window.location.search);
    let category = decodeURIComponent(params.get("cat") || "");

    let allProducts = [];

    document.getElementById("catName").innerText = category || "All Category";
    document.getElementById("topHeaderTitle").innerText = category || "Category";

    async function loadCategory(){
      let query = supabaseClient.from("products").select("*");
      if (category) {
        query = query.ilike("category", category);
      }

      let { data, error } = await query;

      if (error) {
        console.error("Error fetching products:", error);
        return;
      }

      allProducts = data || [];
      document.getElementById("count").innerText = `${allProducts.length} Items Available`;

      if(allProducts.length > 0 && allProducts[0].image){
        document.getElementById("categoryHeroImg").src = allProducts[0].image;
      }

      renderProducts();
    }

    function renderProducts(){
      let box = document.getElementById("productList");
      box.innerHTML = "";

      if (allProducts.length === 0) {
        box.innerHTML = `<div class="no-products"><i class="fa-solid fa-box-open"></i><p>No items found.</p></div>`;
        return;
      }

      allProducts.forEach(p => {
        let div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
          <div class="card-img-wrapper">
            <img src="${p.image || 'https://via.placeholder.com/150'}" alt="${p.title}">
            <span class="card-tag">${category || 'Fresh'}</span>
          </div>
          <div class="card-body">
            <h4>${p.title}</h4>
            <p>${p.description || "Fresh & quality product."}</p>
            <div class="price-row">
              <span class="price">₹${p.price}</span>
              <button class="add-btn"><i class="fa-solid fa-plus"></i> Add</button>
            </div>
          </div>
        `;

        // Entire Card Click Event -> Redirects to product detail page
        div.addEventListener("click", () => {
          window.location.href = `product.html?id=${p.id}`;
        });

        // Add Button Click Event -> Adds product to cart without redirecting
        let addBtn = div.querySelector(".add-btn");
        addBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          addCart(p);
        });

        box.appendChild(div);
      });
    }

    function addCart(item){
      let exist = cart.find(c => c.id === item.id);

      if(exist){
        exist.qty++;
      } else {
        cart.push({...item, qty: 1});
      }

      saveCart();
    }

    function updateCart(){
      let totalItems = cart.reduce((a,b) => a + b.qty, 0);
      let totalPrice = cart.reduce((a,b) => a + (b.qty * b.price), 0);

      document.getElementById("cartInfo").innerText = `${totalItems} Items | ₹${totalPrice}`;
      document.getElementById("headerCartBadge").innerText = totalItems;
      document.getElementById("cartDrawerTotal").innerText = `₹${totalPrice}`;

      renderCart();
    }

    function renderCart(){
      let box = document.getElementById("cartItems");
      box.innerHTML = "";

      if(cart.length === 0){
        box.innerHTML = `
          <div class="cart-empty">
            <i class="fa-solid fa-basket-shopping"></i>
            <p>Your cart is empty!</p>
          </div>`;
        return;
      }

      cart.forEach((c, index) => {
        let itemDiv = document.createElement("div");
        itemDiv.className = "cart-item";
        itemDiv.innerHTML = `
          <img src="${c.image}" alt="${c.title}" />
          <div class="cart-info">
            <h4>${c.title}</h4>
            <p class="item-price">₹${c.price}</p>
            <div class="qty-box">
              <button onclick="decreaseQty(${index})">-</button>
              <span>${c.qty}</span>
              <button onclick="increaseQty(${index})">+</button>
            </div>
          </div>
          <i class="fa-solid fa-trash-can delete" onclick="removeItem(${index})"></i>
        `;
        box.appendChild(itemDiv);
      });
    }

    function increaseQty(i){
      cart[i].qty++;
      saveCart();
    }

    function decreaseQty(i){
      if(cart[i].qty > 1){
        cart[i].qty--;
      } else {
        cart.splice(i, 1);
      }
      saveCart();
    }

    function removeItem(i){
      cart.splice(i, 1);
      saveCart();
    }

    function saveCart(){
      localStorage.setItem("cart", JSON.stringify(cart));
      updateCart();
    }

    function toggleCart(){
      let cartDrawer = document.getElementById("cartDrawer");
      let overlay = document.getElementById("cartOverlay");

      cartDrawer.classList.toggle("show");
      overlay.classList.toggle("show");
      document.body.classList.toggle("cart-open");
    }

    function goToCart(){
      window.location.href = "cart.html";
    }

    updateCart();
    loadCategory();
  </script>
  <script src="back.js"></script>
</body>
</html>
